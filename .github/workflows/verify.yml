name: Travel Plan review

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  jenkins:
    name: travel-plan/jenkins
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare isolated runner
        run: |
          python -m pip install -r scripts/requirements.txt
          sudo sysctl -w vm.max_map_count=524288
          python scripts/prepare-ci-review.py
          python scripts/bootstrap.py
          docker compose stop postgres vault
      - name: Build Jenkins controller and isolated agent
        run: |
          docker compose -f compose.yml -f compose.tools.yml --profile tools build jenkins
          docker build -f infra/jenkins/agent.Dockerfile -t travel-plan-ci-agent:github .
      - name: Execute Jenkins pipeline and Sonar gate
        run: python scripts/github-ci.py
      - name: Upload sanitized Jenkins and Sonar evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jenkins-sonar-evidence
          path: work/github-ci/
          if-no-files-found: warn
          retention-days: 14
      - name: Stop disposable CI services
        if: always()
        run: |
          docker stop travel-plan-github-agent 2>/dev/null || true
          docker compose -f compose.yml -f compose.tools.yml --profile tools stop

  integration:
    name: travel-plan/live-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PLAYWRIGHT_CHROMIUM: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Deploy two replicas on the disposable runner
        run: |
          python -m pip install -r scripts/requirements.txt
          python scripts/start.py --replicas 2
          docker compose -f compose.yml -f compose.tools.yml --profile monitoring up -d loki log-collector
      - name: Verify internal TLS, database access and centralized logging
        run: |
          python scripts/verify-infrastructure.py
          python scripts/verify-logging.py --report work/verification/logging.json
      - name: Run live Chrome and Firefox tests
        working-directory: dashboard
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox
          npm run test:e2e
      - name: Verify Java replica recovery
        run: python scripts/verify-failover.py --run-failover --report work/verification/failover.json
      - name: Upload live test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-test-evidence
          path: |
            work/verification/
            dashboard/playwright-report/
            dashboard/test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Stop disposable application
        if: always()
        run: docker compose -f compose.yml -f compose.tools.yml --profile monitoring stop
